---
# Production Streams Account
# Dedicated account for JetStream-based messaging
apiVersion: nats.jradikk/v1alpha1
kind: NatsAccount
metadata:
  name: production-streams
  namespace: default
  labels:
    account: production-streams
    jetstream: "true"
spec:
  authConfigRef:
    name: main
    namespace: default

  description: "Production account with JetStream streams for order processing"

  # Account-level resource limits
  limits:
    # Connection limits
    conn: 150

    # Subscription limits
    subs: 2000

    # Message payload size (10 MB for large payloads)
    payload: 10485760

    # Data transfer limits (100 GB)
    data: 107374182400

    # Allow exports for cross-account communication
    exports: 50
    imports: 50

    # Allow wildcards in exports
    wildcardExports: true

    # JetStream limits — embedded in the account JWT by the operator
    # Presence of this block enables JetStream for this account
    jetstream:
      memoryStorage: -1       # unlimited memory storage
      diskStorage: -1         # unlimited disk storage
      streams: -1             # unlimited streams
      consumer: -1            # unlimited consumers
      maxAckPending: -1
      memoryMaxStreamBytes: -1
      diskMaxStreamBytes: -1
      maxBytesRequired: false
